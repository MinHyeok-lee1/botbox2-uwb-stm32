name: Repository Boundary Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  boundary-check:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Customer boundary scanner
        shell: pwsh
        run: ./tools/check_repo_boundaries.ps1
